pluginManagement {
    repositories {
        gradlePluginPortal()
        // maven.neoforged.net 在国内常被 DNS 污染/阻断（解析到不可达 IP，连接一直停在 SYN_SENT），
        // 这里改用 NeoForge 官方 CDN（内容相同，可达）。
        maven {
            name = 'NeoForged'
            url = 'https://neoforged.forgecdn.net/releases'
        }
    }

}



plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
